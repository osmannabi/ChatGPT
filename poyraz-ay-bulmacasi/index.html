<title>Poyraz'ın Ay Bulmacası</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: grid card on the left, sticky clue dock + clue lists on the right; on phones the dock pins to the bottom like a crossword app. */
:root{
  --bg:#EEF2FB;
  --card:#FFFFFF;
  --fg:#1B1D2B;
  --muted:#646A80;
  --line:#E1E5F0;
  --tile:#FFFFFF;
  --tile-line:#CDD3E2;
  --key:#FFFFFF;
  --key-shadow:rgba(40,52,100,.18);
  --star:rgba(94,92,230,.16);
  --accent:#0A84FF;
  --good:#30C759;
  --bad:#FF3B30;
  --shadow:0 1px 2px rgba(30,40,80,.05),0 10px 30px rgba(30,40,80,.08);
  --font:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --gap:3px;
  --cell:min(42px, calc((100vw - 32px - 24px - 11 * var(--gap)) / 12));
  --dock-h:0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D1C; --card:#161A2E; --fg:#F2F3FA; --muted:#9CA1B9; --line:#272C47;
    --tile:#1E2339; --tile-line:#3A405F; --key:#2A2F4B; --key-shadow:rgba(0,0,0,.45);
    --star:rgba(255,255,255,.22); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D1C; --card:#161A2E; --fg:#F2F3FA; --muted:#9CA1B9; --line:#272C47;
  --tile:#1E2339; --tile-line:#3A405F; --key:#2A2F4B; --key-shadow:rgba(0,0,0,.45);
  --star:rgba(255,255,255,.22); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font); color:var(--fg); background-color:var(--bg);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, var(--star) 50%, transparent 51%),
    radial-gradient(2px 2px at 78% 9%, var(--star) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 42% 62%, var(--star) 50%, transparent 51%),
    radial-gradient(2px 2px at 88% 72%, var(--star) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 22% 88%, var(--star) 50%, transparent 51%);
  background-size:420px 420px;
  -webkit-font-smoothing:antialiased;
  padding-inline:16px; padding-block:20px calc(28px + var(--dock-h));
  min-height:100vh;
}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .moon{width:58px;height:58px;flex:none;animation:bob 4s ease-in-out infinite}
.brand h1{margin:0;font-size:clamp(26px,5vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:16px;font-weight:700;line-height:1.35}
.stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{width:84px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#FF9F0A,#FF2D92,#5E5CE6,#0A84FF,#30C759);background-size:300px 100%;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}

/* Main layout */
.layout{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:12px}
.board{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.tbtn{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:800;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);transition:transform .15s}
.tbtn:active{transform:scale(.95)}
.tbtn svg{width:18px;height:18px}
.tbtn.solid{background:var(--c);color:#fff}

.grid{display:grid;grid-template-columns:repeat(12,var(--cell));grid-auto-rows:var(--cell);gap:var(--gap);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.void{pointer-events:none}
.cell{
  position:relative;border-radius:calc(var(--cell) * .24);background:var(--tile);
  box-shadow:inset 0 0 0 1.5px var(--tile-line),0 1.5px 0 var(--key-shadow);
  display:grid;place-items:center;cursor:pointer;
  font-weight:900;font-size:calc(var(--cell) * .54);line-height:1;color:var(--fg);
  transition:background-color .2s,box-shadow .2s,transform .15s;
  scroll-margin-block:80px calc(var(--dock-h) + 16px);
}
.cell .num{position:absolute;top:7%;left:11%;font-size:max(8px,calc(var(--cell) * .25));font-weight:900;opacity:.6;line-height:1}
.cell.in-word{background:color-mix(in srgb,var(--wc) 16%,var(--tile));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--wc) 55%,transparent)}
.cell.cursor{background:color-mix(in srgb,var(--wc) 30%,var(--tile));box-shadow:inset 0 0 0 3px var(--wc),0 4px 12px color-mix(in srgb,var(--wc) 40%,transparent);transform:scale(1.08);z-index:2}
.cell.solved{background:var(--sc);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--sc) 60%,#000)}
.cell.solved.dark{color:#2A2100}
.cell.solved.cursor{box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),0 0 0 2px var(--sc)}
.cell.wrong{background:color-mix(in srgb,var(--bad) 22%,var(--tile));box-shadow:inset 0 0 0 2.5px var(--bad);animation:shake .45s}
.cell.revealed::after{content:"";position:absolute;right:11%;bottom:11%;width:max(4px,calc(var(--cell) * .13));height:max(4px,calc(var(--cell) * .13));border-radius:50%;background:currentColor;opacity:.45}
.cell.pop{animation:pop .55s cubic-bezier(.3,1.7,.5,1) both;animation-delay:var(--d,0ms)}

/* Dock: active clue + Turkish keyboard */
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.dock{display:flex;flex-direction:column;gap:12px}
.clue-now{display:flex;align-items:center;gap:10px;border-radius:18px;padding:10px;background:color-mix(in srgb,var(--wc,#0A84FF) 13%,var(--card))}
.clue-now .nav{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 1px 3px var(--key-shadow)}
.clue-now .nav svg{width:18px;height:18px}
.clue-now .body{flex:1;min-width:0}
.clue-now .meta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:9px;background:var(--wc);color:#fff;font-weight:900;font-size:14px;letter-spacing:0}
.badge.dark{color:#2A2100}
.clue-now .text{margin:4px 0 0;font-size:18px;font-weight:800;line-height:1.3}
.clue-now .hint{font-size:14px;font-weight:700;color:var(--muted)}

.kb{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.kb-row{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;max-width:44px;min-width:0;height:46px;border:0;border-radius:10px;background:var(--key);box-shadow:0 2px 0 var(--key-shadow),inset 0 0 0 1px var(--line);font-size:19px;font-weight:900;cursor:pointer;padding:0;transition:transform .08s}
.key:active,.key.hit{transform:translateY(2px) scale(.94);box-shadow:0 0 0 var(--key-shadow),inset 0 0 0 1px var(--line);background:color-mix(in srgb,var(--accent) 18%,var(--key))}
.key.tr{color:#5E5CE6}
.key.wide{max-width:66px;flex-grow:1.5;display:grid;place-items:center}
.key.wide svg{width:22px;height:22px}

.clues{display:grid;grid-template-columns:1fr;gap:16px}
.clues h2{margin:0 0 8px;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.clues h2 svg{width:18px;height:18px}
.clist{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.citem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:14px;padding:9px 10px;cursor:pointer;font-size:16px;font-weight:700;line-height:1.35}
.citem:hover{background:color-mix(in srgb,var(--wc) 8%,transparent)}
.citem.active{background:color-mix(in srgb,var(--wc) 16%,transparent)}
.citem .txt{flex:1;min-width:0}
.citem .len{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.citem .tick{width:22px;height:22px;flex:none;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.7,.5,1);color:var(--wc)}
.citem.solved .txt{color:var(--muted)}
.citem.solved .tick{opacity:1;transform:none}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--fg);color:var(--bg);font-weight:800;font-size:16px;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:40;transition:transform .35s cubic-bezier(.3,1.5,.5,1);max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (min-width:900px){
  :root{--cell:42px}
  .layout{grid-template-columns:auto minmax(0,1fr)}
  .card{padding:18px}
  .side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
  .dock.card{padding:16px}
}
@media (max-width:899px){
  :root{--gap:2.5px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:22px 22px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 -8px 30px rgba(20,30,70,.14);gap:8px}
  .clue-now{padding:8px}
  .clue-now .text{font-size:16px}
  .key{height:42px;font-size:17px;border-radius:8px}
  .kb-row{gap:4px}
}
@media (min-width:600px) and (max-width:899px){
  .clues{grid-template-columns:1fr 1fr}
  :root{--cell:min(40px, calc((100vw - 32px - 24px - 11 * var(--gap)) / 12))}
}

/* ---------- Celebration ---------- */
.party{position:fixed;inset:0;z-index:60;overflow:auto;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#3B2C9A 0%,#1A1650 45%,#090A22 100%);
  display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
  animation:fadeIn .5s ease both}
.party canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.sky{position:fixed;inset:0;pointer-events:none}
.sky span{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 2.4s ease-in-out infinite}
.party-card{position:relative;z-index:2;text-align:center;width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cheer{margin:0;font-weight:900;line-height:1.02;letter-spacing:-.02em;font-size:clamp(46px,12vw,100px)}
.cheer .line{display:block;white-space:nowrap}
.cheer .ch{display:inline-block;color:var(--c);text-shadow:0 5px 0 rgba(0,0,0,.28),0 0 30px color-mix(in srgb,var(--c) 50%,transparent);
  animation:dropIn .8s cubic-bezier(.2,1.6,.4,1) backwards,wave 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * 70ms),calc(1.1s + var(--i) * 90ms)}
.party-sub{margin:6px 0 0;font-size:19px;font-weight:800;opacity:.9;text-wrap:balance}
.party-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.party-stats span{background:rgba(255,255,255,.12);border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.stage{position:relative;width:100%;max-width:520px;height:300px;margin-top:4px}
.mover{position:absolute;left:50%;bottom:0;width:200px;margin-left:-100px;animation:travel 7s ease-in-out infinite alternate}
.astro{width:200px;height:272px;display:block;overflow:visible}
.shadow{position:absolute;left:50%;bottom:-6px;width:120px;height:16px;margin-left:-60px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px);animation:shadow .9s ease-in-out infinite}
.astro .all{transform-box:view-box;transform-origin:100px 240px;animation:dance .9s ease-in-out infinite}
.astro .arm-l{transform-box:view-box;transform-origin:63px 124px;animation:armL .9s ease-in-out infinite}
.astro .arm-r{transform-box:view-box;transform-origin:137px 124px;animation:armR .9s ease-in-out infinite}
.astro .leg-l{transform-box:view-box;transform-origin:83px 184px;animation:legL .9s ease-in-out infinite}
.astro .leg-r{transform-box:view-box;transform-origin:117px 184px;animation:legR .9s ease-in-out infinite}
.astro .head{transform-box:view-box;transform-origin:100px 112px;animation:head 1.8s ease-in-out infinite}
.astro .eyes{transform-box:view-box;transform-origin:100px 68px;animation:blink 3.2s infinite}
.astro .bulb{animation:glow .45s ease-in-out infinite alternate}
.party .moon-dancer{position:absolute;left:4%;top:8px;width:96px;height:96px;animation:moonDance 1.8s ease-in-out infinite}
.party .sun-dancer{position:absolute;right:4%;top:24px;width:74px;height:74px;animation:spin 6s linear infinite}
.party-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pbtn{border:0;cursor:pointer;border-radius:999px;padding:13px 22px;font-size:17px;font-weight:900;display:inline-flex;align-items:center;gap:8px}
.pbtn svg{width:20px;height:20px}
.pbtn.main{background:#fff;color:#2B2380}
.pbtn.ghost{background:rgba(255,255,255,.14);color:#fff}

@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-6deg)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes twinkle{50%{opacity:.15;transform:scale(.6)}}
@keyframes dropIn{0%{transform:translateY(-120px) scale(.3) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes travel{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-7deg)}25%{transform:translateY(-18px) rotate(0)}50%{transform:translateY(0) rotate(7deg)}75%{transform:translateY(-18px) rotate(0)}}
@keyframes shadow{0%,50%,100%{transform:scaleX(1);opacity:.9}25%,75%{transform:scaleX(.7);opacity:.5}}
@keyframes armL{0%,100%{transform:rotate(25deg)}50%{transform:rotate(155deg)}}
@keyframes armR{0%,100%{transform:rotate(-155deg)}50%{transform:rotate(-25deg)}}
@keyframes legL{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(22deg)}}
@keyframes legR{0%,50%,100%{transform:rotate(0)}75%{transform:rotate(-22deg)}}
@keyframes head{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes glow{to{fill:#FF2D92}}
@keyframes moonDance{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-22px) rotate(14deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="moon" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="#FFE29A"/>
        <circle cx="31" cy="33" r="8" fill="#F4C960"/><circle cx="67" cy="28" r="5" fill="#F4C960"/>
        <circle cx="72" cy="63" r="9" fill="#F4C960"/><circle cx="35" cy="73" r="5.5" fill="#F4C960"/>
        <ellipse cx="40" cy="49" rx="3.6" ry="4.6" fill="#3A2E1F"/><ellipse cx="60" cy="49" rx="3.6" ry="4.6" fill="#3A2E1F"/>
        <ellipse cx="32" cy="59" rx="5" ry="3" fill="#FF9DB5" opacity=".75"/><ellipse cx="68" cy="59" rx="5" ry="3" fill="#FF9DB5" opacity=".75"/>
        <path d="M41 60 Q50 69 59 60" stroke="#3A2E1F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Ay Bulmacası</h1>
        <p>Merhaba Poyraz! Ay, Dünya ve Güneş ile ilgili 10 soruyu çöz.</p>
      </div>
    </div>
    <div class="stats">
      <div class="pill" aria-live="polite"><span id="progressText">0 / 10</span><span class="bar"><i id="progressBar"></i></span></div>
      <div class="pill" title="Süre">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <span id="timer">0:00</span>
      </div>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Sesi aç/kapat"></button>
    </div>
  </header>

  <main class="layout">
    <section class="card board" aria-label="Bulmaca">
      <div class="toolbar">
        <button class="tbtn" id="checkBtn" type="button" style="--c:#30A14E">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>Kontrol Et
        </button>
        <button class="tbtn" id="hintBtn" type="button" style="--c:#E89400">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.6V16h6v-.1c0-.6.3-1.2.8-1.6A6.5 6.5 0 0 0 12 2.5z"/></svg>İpucu
        </button>
        <button class="tbtn" id="resetBtn" type="button" style="--c:#8E8EA0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 3.5v5h5"/></svg><span>Baştan Başla</span>
        </button>
        <button class="tbtn solid" id="replayBtn" type="button" style="--c:#5E5CE6" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.3 6.9.6-5.2 4.5 1.6 6.7L12 16.6 6.1 20.1l1.6-6.7L2.5 8.9l6.9-.6z"/></svg>Kutlamayı İzle
        </button>
      </div>
      <div class="grid" id="grid" role="application" aria-label="Bulmaca kareleri"></div>
    </section>

    <aside class="side">
      <div class="dock card" id="dock">
        <div class="clue-now" id="clueNow">
          <button class="nav" id="prevBtn" type="button" aria-label="Önceki soru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="body">
            <div class="meta"><span class="badge" id="cnBadge">1</span><span id="cnDir">Yukarıdan Aşağı</span></div>
            <p class="text" id="cnText"></p>
            <div class="hint" id="cnHint"></div>
          </div>
          <button class="nav" id="nextBtn" type="button" aria-label="Sonraki soru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="kb" id="kb" aria-label="Türkçe klavye"></div>
      </div>

      <div class="card clues">
        <div>
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>Soldan Sağa</h2>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const COLS = 12, ROWS = 19;
const WORDS = [
  {n:1, dir:"down",   r:2,  c:1,  ans:"AY",           color:"#FF9F0A", clue:"Dünya'nın uydusudur."},
  {n:2, dir:"across", r:3,  c:1,  ans:"YENİAY",       color:"#5E5CE6", clue:"Ay'ın Dünya'dan görünmediği evredir."},
  {n:3, dir:"down",   r:1,  c:3,  ans:"GÜNEŞLEKESİ",  color:"#FF453A", clue:"Güneş'in belirli bölgelerinde sıcaklığı diğer yerlere göre daha düşük olan kısımlarıdır.", two:true},
  {n:4, dir:"down",   r:0,  c:6,  ans:"DÜNYA",        color:"#30C759", clue:"Üzerinde yaşam olan tek gezegendir."},
  {n:5, dir:"across", r:7,  c:0,  ans:"GÜNEŞ",        color:"#FFB800", clue:"Dünya'nın ısı ve ışık kaynağıdır.", dark:true},
  {n:6, dir:"across", r:10, c:3,  ans:"SONDÖRDÜN",    color:"#0A84FF", clue:"Ay'ın Dünya'dan bakılınca ters D şeklinde göründüğü evredir.", two:true},
  {n:7, dir:"down",   r:10, c:6,  ans:"DOLUNAY",      color:"#BF5AF2", clue:"Ay'ın tamamen aydınlık görüldüğü evre."},
  {n:8, dir:"across", r:16, c:6,  ans:"YIL",          color:"#00B8B0", clue:"Dünya'nın Güneş etrafında bir tam dolanımına denir."},
  {n:9, dir:"down",   r:9,  c:8,  ans:"KRATER",       color:"#A2845E", clue:"Ay'ın yüzeyine çarpan gök taşlarının oluşturduğu çukurlara denir."},
  {n:10,dir:"down",   r:7,  c:11, ans:"AYINEVRELERİ", color:"#FF2D92", clue:"Ay'ın Dünya'dan gözlemlenen farklı görünümlerine verilen ad.", two:true}
];
const TR_ALPHA = "ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ";
const PRAISE = ["Süper!","Harika!","Bravo Poyraz!","Mükemmel!","Aferin sana!","Çok iyi gidiyorsun!","Yıldız gibisin!"];
const STORE = "poyraz-ay-bulmacasi-v1";

/* ---------- Build cell model ---------- */
const cells = new Map();
const id = (r,c) => r*COLS + c;
WORDS.forEach((w,i) => {
  w.i = i; w.cells = [];
  [...w.ans].forEach((ch,k) => {
    const r = w.r + (w.dir==="down" ? k : 0), c = w.c + (w.dir==="across" ? k : 0), key = id(r,c);
    let cell = cells.get(key);
    if (!cell) { cell = {r,c,key,ans:ch,across:-1,down:-1,num:null}; cells.set(key,cell); }
    cell[w.dir] = i; w.cells.push(key);
  });
  cells.get(w.cells[0]).num = w.n;
});
const ORDER = WORDS.slice().sort((a,b)=>a.n-b.n).map(w=>w.i);

/* ---------- State ---------- */
let S = fresh();
function fresh(){ return {vals:{}, rev:{}, solved:[], hints:0, elapsed:0, done:false, sound:true}; }
try { const raw = localStorage.getItem(STORE); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e) {} }
let cur = WORDS[0].cells[0], dir = "down";

/* ---------- DOM: grid ---------- */
const gridEl = $("#grid"), cellEls = new Map();
for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
  const cell = cells.get(id(r,c));
  const el = document.createElement("div");
  if (!cell){ el.className = "void"; gridEl.appendChild(el); continue; }
  el.className = "cell";
  el.innerHTML = (cell.num ? `<span class="num">${cell.num}</span>` : "") + `<span class="ch"></span>`;
  el.addEventListener("click", () => tapCell(cell.key));
  gridEl.appendChild(el); cellEls.set(cell.key, el);
}

/* ---------- DOM: clues ---------- */
const clueEls = [];
WORDS.slice().sort((a,b)=>a.n-b.n).forEach(w => {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button"; b.className = "citem"; b.style.setProperty("--wc", w.color);
  b.innerHTML = `<span class="badge${w.dark?" dark":""}" style="--wc:${w.color}">${w.n}</span>
    <span class="txt">${w.clue}<span class="len">${w.ans.length} harf${w.two?" · iki kelime, bitişik yaz":""}</span></span>
    <svg class="tick" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.3 3.3L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  b.addEventListener("click", () => selectWord(w.i, true));
  li.appendChild(b);
  (w.dir==="across" ? $("#acrossList") : $("#downList")).appendChild(li);
  clueEls[w.i] = b;
});

/* ---------- DOM: Turkish keyboard ---------- */
const KB = [["E","R","T","Y","U","I","O","P","Ğ","Ü"],["A","S","D","F","G","H","J","K","L","Ş","İ"],["Z","C","V","B","N","M","Ö","Ç","DEL"]];
const TR_EXTRA = new Set(["Ç","Ğ","I","İ","Ö","Ş","Ü"]);
const keyEls = {};
KB.forEach(row => {
  const rowEl = document.createElement("div"); rowEl.className = "kb-row";
  row.forEach(k => {
    const b = document.createElement("button"); b.type = "button";
    if (k==="DEL"){ b.className="key wide"; b.setAttribute("aria-label","Sil");
      b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>`;
      b.addEventListener("click", backspace);
    } else { b.className = "key" + (TR_EXTRA.has(k)?" tr":""); b.textContent = k; b.addEventListener("click", () => input(k)); }
    keyEls[k] = b; rowEl.appendChild(b);
  });
  $("#kb").appendChild(rowEl);
});

/* ---------- Logic helpers ---------- */
const other = d => d==="across" ? "down" : "across";
const wordAt = (key,d) => cells.get(key)[d];
function activeWord(){
  let wi = wordAt(cur,dir);
  if (wi < 0){ dir = other(dir); wi = wordAt(cur,dir); }
  return wi;
}
const locked = key => { const c = cells.get(key); return S.solved.includes(c.across) || S.solved.includes(c.down); };
const wordCorrect = wi => WORDS[wi].cells.every(k => S.vals[k] === cells.get(k).ans);

function tapCell(key){
  if (key === cur){ if (wordAt(key, other(dir)) >= 0) dir = other(dir); }
  else { cur = key; if (wordAt(key,dir) < 0) dir = other(dir); }
  sfx("tap"); render(true);
}
function selectWord(wi, scroll){
  const w = WORDS[wi]; dir = w.dir;
  cur = w.cells[0];
  render(scroll);
}
function stepWord(delta){
  const wi = activeWord(); let p = ORDER.indexOf(wi);
  for (let n=0;n<ORDER.length;n++){
    p = (p + delta + ORDER.length) % ORDER.length;
    if (!S.solved.includes(ORDER[p]) || S.solved.length === WORDS.length) return selectWord(ORDER[p], true);
  }
}

function input(ch){
  if (S.done) return;
  flashKey(ch);
  const wi = activeWord(), w = WORDS[wi];
  if (locked(cur)){
    // A letter already solved by a crossing word: typing that same letter just steps over it,
    // so typing the whole word from its first square always works.
    const p = w.cells.indexOf(cur);
    if (cells.get(cur).ans === ch){ if (p < w.cells.length-1) cur = w.cells[p+1]; sfx("tap"); render(true); return; }
    const next = w.cells.slice(p).find(k => !locked(k));
    if (!next) { stepWord(1); return; }
    cur = next;
  }
  S.vals[cur] = ch; delete S.rev[cur];
  sfx("tap"); startClock();
  const pos = w.cells.indexOf(cur);
  const solvedNow = afterInput(cur);
  if (!solvedNow.includes(wi) && pos < w.cells.length-1) cur = w.cells[pos+1];
  save(); render(true);
}
function backspace(){
  if (S.done) return;
  flashKey("DEL");
  const w = WORDS[activeWord()];
  if (!locked(cur) && S.vals[cur]){ delete S.vals[cur]; delete S.rev[cur]; }
  else {
    const prev = w.cells.slice(0, w.cells.indexOf(cur)).reverse().find(k => !locked(k));
    if (prev){ cur = prev; delete S.vals[cur]; delete S.rev[cur]; }
  }
  save(); render(true);
}
function moveArrow(dr,dc){
  const d = dc ? "across" : "down";
  if (dir !== d && wordAt(cur,d) >= 0){ dir = d; render(true); return; }
  const c0 = cells.get(cur); let r = c0.r + dr, c = c0.c + dc;
  while (r>=0 && r<ROWS && c>=0 && c<COLS){
    if (cells.has(id(r,c))){ cur = id(r,c); dir = d; if (wordAt(cur,dir) < 0) dir = other(dir); render(true); return; }
    r += dr; c += dc;
  }
}

function afterInput(key){
  const c = cells.get(key), newly = [];
  ["across","down"].forEach(d => {
    const wi = c[d];
    if (wi >= 0 && !S.solved.includes(wi) && wordCorrect(wi)){ S.solved.push(wi); newly.push(wi); }
  });
  newly.forEach((wi,j) => celebrateWord(wi, j));
  if (newly.length){
    if (S.solved.length === WORDS.length){ S.done = true; stopClock(); save(); setTimeout(() => openParty(true), 1100); }
    else setTimeout(() => { if (S.solved.includes(activeWord())) stepWord(1); }, 650);
  }
  return newly;
}
function celebrateWord(wi, j){
  const w = WORDS[wi];
  w.cells.forEach((k,idx) => {
    const el = cellEls.get(k); el.classList.remove("pop"); void el.offsetWidth;
    el.style.setProperty("--d", (idx*55 + j*150) + "ms"); el.classList.add("pop");
  });
  sfx("word");
  if (S.solved.length < WORDS.length) toast(PRAISE[Math.floor(Math.random()*PRAISE.length)] + "  " + w.n + ". soru tamam");
}

/* ---------- Toolbar actions ---------- */
$("#checkBtn").addEventListener("click", () => {
  const wrong = [...cells.values()].filter(c => S.vals[c.key] && S.vals[c.key] !== c.ans);
  const empty = [...cells.values()].filter(c => !S.vals[c.key]).length;
  if (!wrong.length){ toast(empty ? `Hiç hata yok! ${empty} boş kare kaldı.` : "Hepsi doğru!"); sfx("word"); return; }
  wrong.forEach(c => { const el = cellEls.get(c.key); el.classList.add("wrong"); setTimeout(() => el.classList.remove("wrong"), 1600); });
  sfx("bad"); toast(`${wrong.length} harf yanlış. Kırmızı kareleri düzelt.`);
});
$("#hintBtn").addEventListener("click", () => {
  if (S.done) return;
  const w = WORDS[activeWord()];
  const ok = k => S.vals[k] === cells.get(k).ans;
  const target = (!ok(cur) && w.cells.includes(cur)) ? cur : w.cells.find(k => !ok(k));
  if (!target) return;
  S.vals[target] = cells.get(target).ans; S.rev[target] = true; S.hints++;
  cur = target; startClock();
  const newly = afterInput(target);
  if (!newly.length){ const next = w.cells.slice(w.cells.indexOf(target)+1).find(k => !locked(k)); if (next) cur = next; toast("Bir harf açıldı"); }
  save(); render(true);
});
let resetArmed = null;
$("#resetBtn").addEventListener("click", e => {
  const label = $("#resetBtn span");
  if (!resetArmed){ label.textContent = "Emin misin?"; resetArmed = setTimeout(() => { label.textContent = "Baştan Başla"; resetArmed = null; }, 3000); return; }
  clearTimeout(resetArmed); resetArmed = null; label.textContent = "Baştan Başla";
  resetAll();
});
function resetAll(){
  const sound = S.sound; S = fresh(); S.sound = sound; stopClock(); save();
  cur = WORDS[0].cells[0]; dir = "down"; render(false); window.scrollTo({top:0, behavior:"smooth"});
}
$("#replayBtn").addEventListener("click", () => openParty(false));
$("#prevBtn").addEventListener("click", () => stepWord(-1));
$("#nextBtn").addEventListener("click", () => stepWord(1));

/* ---------- Physical keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("#party").hidden){ if (e.key === "Escape") closeParty(); return; }
  const k = e.key;
  if (k === "Backspace" || k === "Delete"){ e.preventDefault(); backspace(); return; }
  if (k === "ArrowLeft"){ e.preventDefault(); moveArrow(0,-1); return; }
  if (k === "ArrowRight"){ e.preventDefault(); moveArrow(0,1); return; }
  if (k === "ArrowUp"){ e.preventDefault(); moveArrow(-1,0); return; }
  if (k === "ArrowDown"){ e.preventDefault(); moveArrow(1,0); return; }
  if (k === "Tab" || k === "Enter"){ e.preventDefault(); stepWord(e.shiftKey ? -1 : 1); return; }
  if (k === " "){ e.preventDefault(); if (wordAt(cur, other(dir)) >= 0){ dir = other(dir); render(false); } return; }
  if (k.length === 1){
    const up = k.toLocaleUpperCase("tr-TR");
    if (TR_ALPHA.includes(up)){ e.preventDefault(); input(up); }
  }
});
function flashKey(k){ const el = keyEls[k]; if (!el) return; el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 120); }

/* ---------- Render ---------- */
function render(scroll){
  const wi = activeWord(), w = WORDS[wi];
  const solvedColor = {};
  S.solved.forEach(si => WORDS[si].cells.forEach(k => solvedColor[k] = WORDS[si]));
  cells.forEach(c => {
    const el = cellEls.get(c.key), sw = solvedColor[c.key];
    el.querySelector(".ch").textContent = S.vals[c.key] || "";
    el.classList.toggle("in-word", w.cells.includes(c.key));
    el.classList.toggle("cursor", c.key === cur && !S.done);
    el.classList.toggle("solved", !!sw);
    el.classList.toggle("dark", !!(sw && sw.dark));
    el.classList.toggle("revealed", !!S.rev[c.key]);
    el.style.setProperty("--wc", w.color);
    if (sw) el.style.setProperty("--sc", sw.color);
    const parts = [c.num ? c.num + ". soru" : "", S.vals[c.key] || "boş"].filter(Boolean);
    el.setAttribute("aria-label", parts.join(", "));
  });
  WORDS.forEach((x,i) => { clueEls[i].classList.toggle("active", i===wi); clueEls[i].classList.toggle("solved", S.solved.includes(i)); });
  $("#clueNow").style.setProperty("--wc", w.color);
  const badge = $("#cnBadge"); badge.textContent = w.n; badge.classList.toggle("dark", !!w.dark);
  $("#cnDir").textContent = w.dir === "across" ? "Soldan Sağa" : "Yukarıdan Aşağı";
  $("#cnText").textContent = w.clue;
  $("#cnHint").textContent = w.ans.length + " harf" + (w.two ? " · iki kelime, bitişik yaz" : "") + (S.solved.includes(wi) ? " · çözüldü" : "");
  $("#progressText").textContent = S.solved.length + " / " + WORDS.length;
  $("#progressBar").style.width = (S.solved.length / WORDS.length * 100) + "%";
  $("#replayBtn").hidden = !S.done;
  $("#hintBtn").disabled = S.done;
  if (scroll && window.matchMedia("(max-width: 899px)").matches) cellEls.get(cur).scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2100); }

/* ---------- Clock ---------- */
let clock = null;
const fmt = ms => { const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
function startClock(){ if (clock || S.done) return; clock = setInterval(() => { if (document.visibilityState === "visible"){ S.elapsed += 1000; $("#timer").textContent = fmt(S.elapsed); if (S.elapsed % 5000 === 0) save(); } }, 1000); }
function stopClock(){ clearInterval(clock); clock = null; $("#timer").textContent = fmt(S.elapsed); }
$("#timer").textContent = fmt(S.elapsed);
if (!S.done && Object.keys(S.vals).length) startClock();

/* ---------- Sound ---------- */
let actx = null;
function ac(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
const N = m => 440 * Math.pow(2, (m-69)/12);
function tone(f, t, dur, type, vol){
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .12, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function kick(t){
  const a = ac(); const o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  g.gain.setValueAtTime(.32, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .18);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + .2);
}
let noiseBuf = null;
function hat(t){
  const a = ac();
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate * .05, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .04);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
function sfx(kind){
  if (!S.sound) return; const a = ac(); if (!a) return; const t = a.currentTime + .01;
  if (kind === "tap") tone(N(86), t, .05, "sine", .035);
  if (kind === "word") [72,76,79,84].forEach((m,i) => tone(N(m), t + i*.08, .28, "triangle", .12));
  if (kind === "bad") tone(N(50), t, .2, "square", .04);
  if (kind === "fanfare") [60,64,67,72,67,72,76,79,84].forEach((m,i) => tone(N(m), t + i*.1, i===8 ? .7 : .2, "triangle", .14));
}
const MEL = [72,76,79,76, 77,81,79,76, 74,77,76,72, 74,79,84,null, 72,76,79,84, 81,79,77,76, 74,77,79,77, 76,74,72,null];
const BASS = [48,48,53,53,55,55,48,48, 48,48,53,53,55,55,48,48];
let musicT = null;
function startMusic(){
  if (musicT || !S.sound) return; const a = ac(); if (!a) return;
  let next = a.currentTime + .1, step = 0; const e = .21;
  musicT = setInterval(() => {
    while (next < a.currentTime + .3){
      const s = step % 32, m = MEL[s];
      if (m) tone(N(m), next, e*.85, "square", .03);
      if (s % 2 === 0){ tone(N(BASS[(s/2) % 16]), next, e*1.7, "triangle", .11); if (s % 4 === 0) kick(next); }
      else hat(next);
      next += e; step++;
    }
  }, 60);
}
function stopMusic(){ clearInterval(musicT); musicT = null; }

const ICON_ON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
const ICON_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>`;
function paintSound(){
  $("#soundBtn").innerHTML = S.sound ? ICON_ON : ICON_OFF;
  $("#musicBtn").innerHTML = (S.sound ? ICON_ON : ICON_OFF) + (S.sound ? "Müziği Kapat" : "Müziği Aç");
}
$("#soundBtn").addEventListener("click", () => { S.sound = !S.sound; save(); paintSound(); if (!S.sound) stopMusic(); else sfx("word"); });
$("#musicBtn").addEventListener("click", () => { S.sound = !S.sound; save(); paintSound(); if (S.sound) startMusic(); else stopMusic(); });
paintSound();

/* ---------- Celebration ---------- */
const CHEER_COLORS = ["#FFD60A","#FF9F0A","#FF6482","#FF2D92","#BF5AF2","#7D7AFF","#64D2FF","#30D158"];
function buildCheer(){
  const lines = ["Tebrikler", "Poyraz!"]; let i = 0;
  $("#cheer").innerHTML = lines.map(l => `<span class="line">${[...l].map(ch => `<span class="ch" style="--i:${i};--c:${CHEER_COLORS[(i++) % CHEER_COLORS.length]}">${ch}</span>`).join("")}</span>`).join("");
}
function buildSky(){
  const sky = $("#sky"); if (sky.childElementCount) return;
  for (let i=0;i<70;i++){
    const s = document.createElement("span");
    const z = Math.random()*2.5 + 1;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*2.4}s;opacity:${.4+Math.random()*.6}`;
    sky.appendChild(s);
  }
}
function openParty(withFanfare){
  buildCheer(); buildSky();
  $("#pTime").textContent = "Süre " + fmt(S.elapsed);
  $("#pHints").textContent = "İpucu " + S.hints;
  $("#party").hidden = false; document.body.style.overflow = "hidden";
  startConfetti();
  if (S.sound){ if (withFanfare) sfx("fanfare"); setTimeout(startMusic, withFanfare ? 1000 : 50); }
  $("#againBtn").focus({preventScroll:true});
}
function closeParty(){
  $("#party").hidden = true; document.body.style.overflow = "";
  stopConfetti(); stopMusic(); render(false);
}
$("#closeBtn").addEventListener("click", closeParty);
$("#againBtn").addEventListener("click", () => { closeParty(); resetAll(); });

/* Confetti */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0, partyStart = 0, W = 0, H = 0;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCv(){ const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; cx.setTransform(d,0,0,d,0,0); }
function piece(x, y, vx, vy){
  return {x, y, vx, vy, rot: Math.random()*6.28, vr: (Math.random()-.5)*.3, s: 6 + Math.random()*8,
    col: CHEER_COLORS[Math.floor(Math.random()*CHEER_COLORS.length)], shape: Math.floor(Math.random()*3), wob: Math.random()*6.28};
}
function burst(x, y, n, ang){
  for (let i=0;i<n;i++){ const a = ang + (Math.random()-.5)*.9, sp = 9 + Math.random()*10; parts.push(piece(x, y, Math.cos(a)*sp, Math.sin(a)*sp)); }
}
function drawStar(r){ cx.beginPath(); for (let i=0;i<10;i++){ const rr = i%2 ? r*.45 : r, a = i*Math.PI/5 - Math.PI/2; cx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } cx.closePath(); cx.fill(); }
function frame(){
  cx.clearRect(0,0,W,H);
  const t = performance.now() - partyStart;
  if (t > 600 && t < 1400 && Math.random() < .08) burst(Math.random()*W, H*.3, 40, -Math.PI/2);
  if (parts.length < 140 && Math.random() < .5) parts.push(piece(Math.random()*W, -20, (Math.random()-.5)*2, 1.5 + Math.random()*2));
  parts = parts.filter(p => p.y < H + 40);
  for (const p of parts){
    p.vy += .16; p.vx *= .99; p.vy = Math.min(p.vy, 5 + p.s*.2); p.wob += .1;
    p.x += p.vx + Math.sin(p.wob)*.6; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.col;
    if (p.shape === 0) cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
    else if (p.shape === 1){ cx.beginPath(); cx.arc(0,0,p.s/2.6,0,6.28); cx.fill(); }
    else drawStar(p.s/1.6);
    cx.restore();
  }
  raf = requestAnimationFrame(frame);
}
function startConfetti(){
  if (reduce) return;
  sizeCv(); parts = []; partyStart = performance.now();
  burst(0, H, 90, -Math.PI/3); burst(W, H, 90, -Math.PI*2/3);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
}
function stopConfetti(){ cancelAnimationFrame(raf); raf = 0; cx.clearRect(0,0,W,H); }
addEventListener("resize", () => { if (!$("#party").hidden) sizeCv(); });

/* ---------- Mobile dock height ---------- */
const dock = $("#dock");
function syncDock(){
  const fixed = getComputedStyle(dock).position === "fixed";
  document.documentElement.style.setProperty("--dock-h", fixed ? dock.offsetHeight + "px" : "0px");
}
if ("ResizeObserver" in window) new ResizeObserver(syncDock).observe(dock);
addEventListener("resize", syncDock); syncDock();

/* ---------- Boot ---------- */
render(false);
if (location.hash === "#kutlama") openParty(false);
})();
</script>
